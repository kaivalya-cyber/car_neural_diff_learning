# Competitive preset: high-performance settings for maximum reward
learning_rate: 0.0003
gamma: 0.995
gae_lambda: 0.95
k_epochs: 4
eps_clip: 0.2
max_grad_norm: 0.5
lr_decay: 0.999
lr_warmup_epochs: 10
entropy_coef: 0.015
entropy_decay: 0.9995
normalize_rewards: true
max_episodes: 3000
update_timestep: 500
num_envs: 32
sensor_count: 16
obstacle_count: 2
val_interval: 50
early_stop_patience: 300
top_k_checkpoints: 3
curriculum_start: 0.0
curriculum_max: 1.0
curriculum_up_threshold: 50.0
curriculum_down_threshold: 10.0
curriculum_up_rate: 0.05
curriculum_down_rate: 0.03
curriculum_threshold_growth: 1.01
curriculum_window: 10
curriculum_min_samples: 5
hidden_size: 256
num_blocks: 2
dropout: 0.0
