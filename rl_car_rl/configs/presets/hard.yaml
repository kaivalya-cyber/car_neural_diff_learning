# Hard preset: maximum difficulty, full sensor suite, obstacles
learning_rate: 0.0001
gamma: 0.99
gae_lambda: 0.97
k_epochs: 8
eps_clip: 0.1
max_grad_norm: 0.3
lr_decay: 0.9995
lr_warmup_epochs: 20
entropy_coef: 0.01
entropy_decay: 0.9995
max_episodes: 5000
update_timestep: 1000
num_envs: 64
sensor_count: 16
obstacle_count: 4
val_interval: 100
early_stop_patience: 500
top_k_checkpoints: 5
curriculum_start: 0.0
curriculum_up_threshold: 60.0
curriculum_down_threshold: 15.0
curriculum_up_rate: 0.03
curriculum_down_rate: 0.02
curriculum_threshold_growth: 1.02
curriculum_window: 15
hidden_size: 256
num_blocks: 3
dropout: 0.05
